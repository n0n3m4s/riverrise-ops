# Sync order:
#   -5  sealed-secrets-key (TLS keypair з private secrets-репо)
#   -4  sealed-secrets controller
#   -2  Secrets / SealedSecrets (environments/prod/secrets/)
#
# Secrets repo layout (riverrise-secrets):
#   clusters/prod/sealed-secrets/sealed-secrets-key.yaml
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-key
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: infra
  source:
    repoURL: git@github.com:n0n3m4s/riverrise-secrets.git
    targetRevision: main
    path: clusters/prod/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
