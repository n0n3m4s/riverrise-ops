# Cilium already runs in the cluster (CNI + cilium-envoy).
# Prerequisites (Argo CD, sync-wave before this app):
#   - apps/<env>/infra/application-gateway-api-crds.yaml  (wave -6)
#   - apps/<env>/infra/application-cilium.yaml            (wave -5, gatewayAPI.enabled)
#
# This chart only creates the Gateway that HTTPRoutes attach to.

gateway:
  name: cilium
  gatewayClassName: cilium
  listeners:
    web:
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    # Увімкни після cert-manager / TLS Secret:
    # websecure:
    #   port: 443
    #   protocol: HTTPS
    #   allowedRoutes:
    #     namespaces:
    #       from: All
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - kind: Secret
    #         name: riverrise-net-tls

# Optional: Cilium LB IPAM + L2 announcement (bare-metal / UpCloud without CCM LB).
# Залиш enable: false, якщо EXTERNAL-IP дає cloud LB або використовуєш hostNetwork.
lb:
  enabled: false
