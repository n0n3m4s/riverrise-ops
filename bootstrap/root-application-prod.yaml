# Bootstrap для кластера PROD.
#   kubectl apply -n argocd -f bootstrap/root-application-prod.yaml
#
# Root синкає: projects + apps/prod/**
# SealedSecrets — Application prod-secrets (після sealed-secrets controller).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/n0n3m4s/riverrise-ops.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      include: '{projects/*.yaml,apps/prod/**/*.yaml}'
      exclude: '{**/*.example.yaml,**/*.yaml.example,**/examples/**,**/*.yaml.disabled}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
