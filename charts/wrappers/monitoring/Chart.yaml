apiVersion: v2
name: monitoring
description: >-
  Grafana observability stack — kube-prometheus-stack (metrics/pods),
  Loki (logs), Alloy (log shipper). Dashboards provisioned into Grafana folders.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: 88.6.1
    repository: https://prometheus-community.github.io/helm-charts
    alias: kps
  - name: loki
    version: 7.3.0
    repository: https://grafana.github.io/helm-charts
  - name: alloy
    version: 1.12.1
    repository: https://grafana.github.io/helm-charts
