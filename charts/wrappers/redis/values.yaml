# Redis (CloudPirates). Auth via existing Secret when deployed.
# NetworkPolicies: charts/network-policies (NS databases)
redis:
  architecture: standalone
  auth:
    enabled: true
    existingSecret: redis-auth
    existingSecretPasswordKey: redis-password
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  networkPolicy:
    enabled: false
