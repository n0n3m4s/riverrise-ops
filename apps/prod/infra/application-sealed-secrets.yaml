# Sealed Secrets controller. Sync-wave after sealing key (-5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: infra
  source:
    repoURL: git@github.com:n0n3m4s/riverrise-ops.git
    targetRevision: main
    path: charts/wrappers/sealed-secrets
    helm:
      releaseName: sealed-secrets
      valueFiles:
        - ../../../environments/prod/values/sealed-secrets.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
