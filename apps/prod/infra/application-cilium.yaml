# Adopt existing Helm release `cilium` in kube-system; enables Gateway API controller.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: infra
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.18.6
      helm:
        releaseName: cilium
        valueFiles:
          - $values/environments/prod/values/cilium.yaml
    - repoURL: git@github.com:n0n3m4s/riverrise-ops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
