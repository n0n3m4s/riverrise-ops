apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: services
  source:
    repoURL: git@github.com:n0n3m4s/riverrise-ops.git
    targetRevision: main
    path: charts/basic-chart
    helm:
      releaseName: frontend
      valueFiles:
        - ../../environments/prod/values/services/frontend.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
