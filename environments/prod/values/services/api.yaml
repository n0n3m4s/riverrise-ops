# Secrets from SealedSecret `api` (environments/prod/secrets/api.sealed.yaml)
envFrom:
  - secretRef:
      name: api

# Host(riverrise.net) && PathPrefix(/api) → api (Cilium Gateway), strip /api → /
httpRoute:
  enabled: true
  parentRefs:
    - name: cilium
      namespace: gateway
      sectionName: web
  routes:
    - name: api-from-front
      hostnames:
        - riverrise.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
