# Existing UpCloud / cluster Cilium install (helm release: cilium @ kube-system).
# Keep kube-proxy replacement + IPAM as currently deployed; only add Gateway API.
k8sServiceHost: auto
k8sServicePort: 6443
kubeProxyReplacement: true

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 192.168.0.0/16

gatewayAPI:
  enabled: true

operator:
  replicas: 1
