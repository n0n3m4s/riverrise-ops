# Existing UpCloud / cluster Cilium install (helm release: cilium @ kube-system).
# Keep kube-proxy replacement + IPAM as currently deployed; only add Gateway API.
# NOTE: "auto" is NOT resolved — it becomes hostname "auto" and breaks the operator.
# Use the kubernetes Endpoint IP:port (kubectl get ep kubernetes).
k8sServiceHost: "100.102.142.3"
k8sServicePort: "6443"
kubeProxyReplacement: true

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 192.168.0.0/16

gatewayAPI:
  enabled: true

operator:
  replicas: 1
