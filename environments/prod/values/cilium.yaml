# Existing UpCloud / cluster Cilium install (helm release: cilium @ kube-system).
# k8sServiceHost must be a real DNS/IP (literal "auto" breaks the operator).
# Prefer the cluster API load balancer from kubeconfig — survives control-plane IP moves.
k8sServiceHost: "lb-0a825e4a4813414cbf97cfb7464ee1fc-1.upcloudlb.com"
k8sServicePort: "7443"
kubeProxyReplacement: true

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 192.168.0.0/16

gatewayAPI:
  enabled: true

operator:
  replicas: 1
