# Existing UpCloud / cluster Cilium install (helm release: cilium @ kube-system).
# k8sServiceHost must be a real address reachable FROM THE NODES.
# UpCloud external API LB (:7443) times out from workers — use kubernetes Endpoints IP:6443.
# Check: kubectl get ep kubernetes
# If control-plane IP moves, update this value and sync the cilium Application.
k8sServiceHost: "100.102.142.3"
k8sServicePort: "6443"
kubeProxyReplacement: true

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 192.168.0.0/16

gatewayAPI:
  enabled: true

operator:
  replicas: 1
